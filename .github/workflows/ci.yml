name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_PUBLIC_URL: http://localhost:8080
      WORKSPACE_ROOT: /tmp/workspaces

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and ruff
        run: pip install uv ruff

      - name: Install dependencies
        run: uv sync --frozen --group dev
        working-directory: manager

      - name: Lint
        run: ruff check manager/app manager/tests

      - name: Format check
        run: ruff format --check manager/app manager/tests

      - name: Run tests
        run: uv run pytest
        working-directory: manager

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    env:
      BASE_PUBLIC_URL: http://localhost:8080
      WORKSPACE_ROOT: /tmp/workspaces

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: cp .env.example .env && sed -i 's|WORKSPACE_ROOT=.*|WORKSPACE_ROOT=/tmp/workspaces|' .env

      - name: Validate docker compose config
        run: docker compose config

      - name: Build manager image
        run: docker compose build manager

      - name: Build nginx/frontend image
        run: docker compose build nginx
