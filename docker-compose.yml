services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - vscode-manager-net
    depends_on:
      - manager

  manager:
    build: ./manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_ROOT:-./workspaces}:/workspaces
    env_file: .env
    networks:
      - vscode-manager-net
    expose:
      - "8000"

networks:
  vscode-manager-net:
    name: ${MANAGED_NETWORK_NAME:-vscode-manager-net}
    driver: bridge
