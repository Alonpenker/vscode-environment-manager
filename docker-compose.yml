name: vscode-environment-manager
services:
  nginx:
    build:
      context: ./nginx
      additional_contexts:
        frontend: ./frontend
    ports:
      - "8080:80"
    environment:
      - CONTAINER_NAME_PREFIX=${CONTAINER_NAME_PREFIX:-vscode-env-}
      - VSCODE_CONTAINER_PORT=${VSCODE_CONTAINER_PORT:-3000}
    networks:
      - vscode-manager-net
    depends_on:
      - manager

  manager:
    build: ./manager
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_ROOT}:${WORKSPACE_CONTAINER_ROOT:-/workspaces}
    env_file: .env
    networks:
      - vscode-manager-net

networks:
  vscode-manager-net:
    name: ${MANAGED_NETWORK_NAME:-vscode-manager-net}
    driver: bridge
